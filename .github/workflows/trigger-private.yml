name: 定时触发私人实例

# 为什么定时器放在这个公开仓库：
# GitHub Free 账号的私有仓库不支持 schedule 触发（cron 事件不会入队，
# 只认 workflow_dispatch）。所以把定时器放在公开仓库，每天调用私有仓库的
# workflow_dispatch API，由私有仓库执行真正的抓取、精读、推送。
#
# 需要的 Secret：TRIGGER_TOKEN
#   一个 fine-grained PAT，对私有仓库 paper-radar 有 "Actions: Read and write" 权限。
# 没有配置时本 workflow 会直接跳过（开源模板默认不触发任何私人实例）。

on:
  schedule:
    # 北京时间 09:30（UTC 01:30）
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发私有仓库的日报任务
        env:
          TOKEN: ${{ secrets.TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "未配置 TRIGGER_TOKEN，跳过（开源模板默认不触发私人实例）"
            exit 0
          fi
          HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ZLFan/paper-radar/actions/workflows/daily.yml/dispatches \
            -d '{"ref":"main"}')
          echo "触发 API 返回 HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "204" ]; then
            echo "触发失败，响应内容："
            cat /tmp/resp.txt
            exit 1
          fi
          echo "✅ 已触发私有仓库的日报任务"
